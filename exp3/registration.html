<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration Portal - Exp 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Healthcare Portal Patient Registration</h1>
            <p>Complete all required fields to register a patient for consultation.</p>
        </header>

        <div id="success-banner" class="success-banner"></div>

        <form id="registration-form" name="registration_form" action="#" method="post" novalidate>
            
            <!-- Personal Details Fieldset -->
            <fieldset>
                <legend>Personal Details</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="patient_name">Patient Name <span class="required">*</span></label>
                        <input type="text" id="patient_name" name="patient_name" placeholder="Enter full patient name" autocomplete="name">
                        <span id="error-patient_name" class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" name="dob">
                        <span id="error-dob" class="error-message"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender <span class="required">*</span></label>
                        <select id="gender" name="gender">
                            <option value="">-- Select Gender --</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                        <span id="error-gender" class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="blood_group">Blood Group <span class="required">*</span></label>
                        <select id="blood_group" name="blood_group">
                            <option value="">-- Select Blood Group --</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                        <span id="error-blood_group" class="error-message"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address <span class="required">*</span></label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter complete residential address"></textarea>
                    <span id="error-address" class="error-message"></span>
                </div>
            </fieldset>

            <!-- Contact Information Fieldset -->
            <fieldset>
                <legend>Contact Information</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="mobile">Mobile Number <span class="required">*</span></label>
                        <input type="tel" id="mobile" name="mobile" placeholder="10-digit Indian mobile number" autocomplete="tel">
                        <span id="error-mobile" class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="patient@example.com" autocomplete="email">
                        <span id="error-email" class="error-message"></span>
                    </div>
                </div>
            </fieldset>

            <!-- Appointment & Registration Details Fieldset -->
            <fieldset>
                <legend>Appointment &amp; Registration Details</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department / Appointment Type <span class="required">*</span></label>
                        <select id="department" name="department">
                            <option value="">-- Select Department --</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Urology">Urology</option>
                            <option value="Dermatology">Dermatology</option>
                        </select>
                        <span id="error-department" class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="registration_date">Registration Date <span class="required">*</span></label>
                        <input type="date" id="registration_date" name="registration_date">
                        <span id="error-registration_date" class="error-message"></span>
                    </div>
                </div>
            </fieldset>

            <!-- Submit and Reset Buttons -->
            <div class="button-group">
                <button type="reset" id="reset-btn" class="btn btn-reset">Reset Form</button>
                <button type="submit" id="submit-btn" class="btn btn-submit">Submit Registration</button>
            </div>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
